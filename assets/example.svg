<svg xmlns="http://www.w3.org/2000/svg" width="840" height="228" viewBox="0 0 840 228" role="img" aria-label="One LoCoMo question from history to judged answer"><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;fill:#8B949E} .t{font-size:15px;font-weight:600;fill:#3E61FF} .s{font-size:13px} .v{font-size:13px;font-weight:600} .w{fill:#FFFFFF}</style><text class="t" x="0" y="18">One LoCoMo question, end to end (conv-26-q3)</text><text class="v" x="0" y="50">History</text><text class="s" x="0" y="68">19 sessions · 419 turns</text><text class="s" x="0" y="84">~16k tokens</text><rect x="0" y="98" width="28" height="18" rx="4" fill="#DCE3FF"/><rect x="34" y="98" width="28" height="18" rx="4" fill="#3E61FF"/><rect x="68" y="98" width="28" height="18" rx="4" fill="#DCE3FF"/><rect x="102" y="98" width="28" height="18" rx="4" fill="#DCE3FF"/><rect x="136" y="98" width="28" height="18" rx="4" fill="#DCE3FF"/><rect x="0" y="124" width="28" height="18" rx="4" fill="#DCE3FF"/><rect x="34" y="124" width="28" height="18" rx="4" fill="#DCE3FF"/><rect x="68" y="124" width="28" height="18" rx="4" fill="#DCE3FF"/><rect x="102" y="124" width="28" height="18" rx="4" fill="#DCE3FF"/><rect x="136" y="124" width="28" height="18" rx="4" fill="#DCE3FF"/><rect x="0" y="150" width="28" height="18" rx="4" fill="#DCE3FF"/><rect x="34" y="150" width="28" height="18" rx="4" fill="#DCE3FF"/><rect x="68" y="150" width="28" height="18" rx="4" fill="#DCE3FF"/><rect x="102" y="150" width="28" height="18" rx="4" fill="#DCE3FF"/><rect x="136" y="150" width="28" height="18" rx="4" fill="#DCE3FF"/><rect x="0" y="176" width="28" height="18" rx="4" fill="#DCE3FF"/><rect x="34" y="176" width="28" height="18" rx="4" fill="#DCE3FF"/><rect x="68" y="176" width="28" height="18" rx="4" fill="#DCE3FF"/><rect x="102" y="176" width="28" height="18" rx="4" fill="#DCE3FF"/><text class="s" x="0" y="218">session 2 holds the gold evidence</text><path d="M180 140 h44" stroke="#8B949E" stroke-width="1.6"/><path d="M224 140 l-8 -4 v8 z" fill="#8B949E"/><text class="s" x="202" y="130" text-anchor="middle">ingest</text><text class="v" x="236" y="50">22 dated episodes</text><text class="s" x="236" y="68">Caroline's, one per topic</text><rect x="236" y="82" width="220" height="28" rx="6" fill="#DCE3FF"/><text x="246" y="100" style="font-size:12px;font-weight:600;fill:#3E61FF">05-08</text><text x="292" y="100" style="font-size:12px;fill:#8B949E">LGBTQ support, career plans</text><rect x="236" y="116" width="220" height="28" rx="6" fill="#3E61FF"/><text x="246" y="134" style="font-size:12px;font-weight:600;fill:#FFFFFF">05-25</text><text x="292" y="134" style="font-size:12px;fill:#FFFFFF">charity race, adoption plans</text><rect x="236" y="150" width="220" height="28" rx="6" fill="#DCE3FF"/><text x="246" y="168" style="font-size:12px;font-weight:600;fill:#3E61FF">06-27</text><text x="292" y="168" style="font-size:12px;fill:#8B949E">necklace, camping, counseling</text><rect x="236" y="184" width="220" height="28" rx="6" fill="#DCE3FF"/><text x="246" y="202" style="font-size:12px;font-weight:600;fill:#3E61FF">…</text><text x="292" y="202" style="font-size:12px;fill:#8B949E">19 more, one per topic</text><path d="M462 140 h44" stroke="#8B949E" stroke-width="1.6"/><path d="M506 140 l-8 -4 v8 z" fill="#8B949E"/><text class="s" x="484" y="130" text-anchor="middle">search</text><text class="v" x="518" y="50">“What did Caroline research?”</text><text class="s" x="518" y="70">20 episodes handed to the reader;</text><text class="s" x="518" y="86">the session-2 episode ranks 2nd</text><rect x="518" y="102" width="322" height="62" rx="10" fill="#DCE3FF"/><text x="530" y="122" style="font-size:12px;font-weight:600;fill:#3E61FF">Answer</text><text x="530" y="140" style="font-size:12.5px;fill:#8B949E">Adoption agencies, especially ones</text><text x="530" y="156" style="font-size:12.5px;fill:#8B949E">that support LGBTQ+ individuals…</text><rect x="518" y="174" width="322" height="44" rx="10" fill="#3E61FF"/><text x="530" y="194" style="font-size:12px;fill:#DCE3FF">Gold: adoption agencies</text><text x="530" y="211" style="font-size:13px;font-weight:700;fill:#FFFFFF">Judge: CORRECT</text></svg>
